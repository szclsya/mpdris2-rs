[package]
name = "mpdris2-rs"
version = "1.0.0-beta.1"
edition = "2021"
authors = ["Leo Shen <i@szclsya.me>"]
license = "GPL-3.0-or-later"
rust-version = "1.80.1"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "macros"]}
futures = "0.3"
futures-util = "0.3"
# Commuicating with D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
serde = "1"
# Parsing MPD protocol
nom = "8"
# Creating unique album art filenames
twox-hash = "2"
base32 = "0.5"
# Logging
log = "0.4"
colored = "3"
fern = { version = "0.7", features = ["colored"] }
# Signal processing
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
# Config
argh = "0.1"
dirs = "6"

[profile.release]
# Optimize for size. This isn't a performance sensitive app
opt-level = "z"
lto = true
strip = true
codegen-units = 1
